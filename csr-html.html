<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#272727">
  <title>Color Switch: Revamped</title>
  <style>
    @font-face {
      font-family: "Blissful Thinking";
      src: url("assets/fonts/Blissful Thinking.otf") format("opentype");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      font-family: "Blissful Thinking", "Segoe Print", "Comic Sans MS", cursive;
      background: #272727;
      color: #f3f1f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #272727;
    }

    button { font: inherit; }

    .game-shell {
      position: relative;
      width: min(100vw, 460px, calc(100dvh * 0.5625));
      aspect-ratio: 9 / 16;
      height: auto;
      max-height: 100dvh;
      min-height: 0;
      container-type: inline-size;
      overflow: hidden;
      isolation: isolate;
      background: #272727;
      box-shadow: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      z-index: 1;
      inset: max(22px, env(safe-area-inset-top)) 22px auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .hud.visible { opacity: 1; }

    .score-label {
      color: #aaa7b0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .score-value {
      margin-top: 3px;
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .mode-chip {
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 5px;
      background: #323137;
      color: #FFE80F;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .overlay {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(41,40,46,.94);
      transition: opacity .2s ease;
    }

    .overlay:has(.panel.main-menu) { padding: 0; }
    .overlay:has(.panel.mode-browser) { padding: 0; }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      width: min(100%, 340px);
      text-align: center;
      animation: none;
    }

    .panel.main-menu {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: none;
      text-align: center;
      transform: none;
    }

    .home-brand {
      position: absolute;
      top: 6%;
      right: 2%;
      left: 2%;
      margin: 0;
      font-family: "Blissful Thinking", "Segoe Print", "Comic Sans MS", cursive;
      font-size: clamp(30px, 15cqw, 56px);
      font-weight: 800;
      letter-spacing: .025em;
      line-height: .86;
      text-align: center;
    }

    .home-brand span {
      display: block;
      color: #f3f1f5;
    }

    @property --logo-o-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    .home-brand .home-brand-color {
      display: block;
      color: #f3f1f5;
      white-space: nowrap;
    }

    .home-brand .home-brand-o {
      display: inline;
      margin: 0;
      color: transparent;
      background: conic-gradient(from var(--logo-o-angle), #32E2F1 0 25%, #FFE80F 25% 50%, #FF0080 50% 75%, #8C12FB 75% 100%);
      background-clip: text;
      -webkit-background-clip: text;
      animation: home-logo-color-spin 2.4s linear infinite;
    }

    .home-brand .home-brand-o.counterclockwise {
      animation-direction: reverse;
    }

    @keyframes home-logo-color-spin {
      to { --logo-o-angle: 360deg; }
    }

    .home-brand .home-brand-switch { letter-spacing: .055em; }

    .home-brand small {
      display: block;
      margin-top: 8px;
      color: #f3f1f5;
      font-size: .48em;
      font-weight: 800;
      letter-spacing: .24em;
      line-height: 1;
    }

    .home-play-stack {
      position: absolute;
      top: 29%;
      left: 50%;
      display: grid;
      width: min(62cqw, 290px);
      aspect-ratio: 1;
      place-items: center;
      transform: translateX(-50%);
    }

    .home-ring {
      position: absolute;
      border-radius: 50%;
      background: conic-gradient(#FF0080 0 25%, #32E2F1 25% 50%, #FFE80F 50% 75%, #8C12FB 75%);
      animation: home-ring-spin 13s linear infinite;
      pointer-events: none;
    }

    .home-ring::after {
      position: absolute;
      inset: 12%;
      border: 0;
      border-radius: inherit;
      background: #272727;
      content: "";
    }

    .home-ring.outer { inset: 0; }
    .home-ring.middle {
      inset: 17%;
      animation-direction: reverse;
    }
    .home-ring.middle::after { inset: 12%; }

    @keyframes home-ring-spin { to { transform: rotate(360deg); } }

    .home-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      display: grid;
      width: 44%;
      aspect-ratio: 1;
      place-items: center;
      border: 7px solid #202020;
      border-radius: 50%;
      background: #59595d;
      color: #fff;
      cursor: pointer;
      animation: home-play-pulse 1.4s ease-in-out infinite;
      transform: translate(-50%, -50%);
    }

    .home-play-button svg { display: block; width: 64%; height: 64%; }

    .home-play-button:focus-visible,
    .home-mode-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @keyframes home-play-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,.22); }
      50% { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 0 9px rgba(255,255,255,0); }
    }

    .home-modes-banner {
      position: absolute;
      top: 72%;
      left: 4%;
      display: flex;
      width: 92%;
      height: 15cqw;
      align-items: center;
      justify-content: space-between;
    }

    .home-banner-star {
      flex: 0 0 9%;
      display: grid;
      place-items: center;
    }

    .home-banner-star svg {
      display: block;
      width: min(7cqw, 27px);
      height: auto;
      overflow: visible;
      fill: #fff;
    }

    .action-button.home-modes-button {
      position: relative;
      width: 76%;
      height: 100%;
      min-height: 0;
      padding: 0 4%;
      clip-path: polygon(4% 0, 96% 0, 100% 50%, 96% 100%, 4% 100%, 0 50%);
      background: #1976d2;
      box-shadow: 0 2px 0 #1056b0;
      color: #fff;
      font-family: "Blissful Thinking", "Segoe Print", "Comic Sans MS", cursive;
      font-size: clamp(10px, 5.3cqw, 18px);
      font-weight: 900;
      letter-spacing: .06em;
      text-shadow: 0 1px 1px rgba(0,0,0,.35);
    }

    .action-button.home-modes-button::before {
      position: absolute;
      top: 3px;
      right: 7%;
      left: 7%;
      height: 0;
      border-top: 2px dotted rgba(255,255,255,.9);
      content: "";
      pointer-events: none;
    }

    .action-button.home-modes-button::after {
      position: absolute;
      right: 7%;
      bottom: 3px;
      left: 7%;
      height: 0;
      border-top: 2px dotted rgba(255,255,255,.9);
      content: "";
      pointer-events: none;
    }

    .home-menu-actions { display: contents; }

    .home-mode-links {
      position: absolute;
      top: 86%;
      right: 3%;
      left: 3%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 2px;
    }

    .home-mode-button {
      display: grid;
      min-width: 0;
      justify-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .home-mode-button:hover { background: transparent; }

    .home-mode-icon {
      display: grid;
      width: min(15cqw, 58px);
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: var(--mode-color);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: clamp(17px, 6cqw, 28px);
      font-weight: 900;
    }

    .home-mode-icon svg {
      width: 64%;
      height: 64%;
      fill: currentColor;
    }

    .home-mode-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .level-select {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .level-select .subtitle { margin: 12px auto 16px; }

    .level-choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .level-choice small {
      font: inherit;
      font-size: 10px;
      letter-spacing: .12em;
    }

    .panel.mode-browser {
      display: flex;
      width: 100%;
      height: 100%;
      max-height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      text-align: left;
    }

    .mode-header {
      position: relative;
      display: flex;
      min-height: clamp(56px, 31cqw, 108px);
      flex: 0 0 auto;
      align-items: center;
      gap: 4cqw;
      margin: 0;
      padding: 3cqw 5cqw 6cqw;
      background: #2169c3;
      color: #fff;
    }

    .mode-header::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: clamp(7px, 3.5cqw, 12px);
      background: linear-gradient(135deg, transparent 50%, #272727 50%) 0 0 / 20px 12px repeat-x,
        linear-gradient(45deg, #272727 50%, transparent 50%) 0 0 / 20px 12px repeat-x;
      content: "";
    }

    .mode-home {
      display: grid;
      width: clamp(32px, 15cqw, 52px);
      height: clamp(32px, 15cqw, 52px);
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #272727;
      cursor: pointer;
    }

    .mode-home svg { width: 66%; height: 66%; }

    .mode-heading {
      margin: 0;
      font-family: "Blissful Thinking", "Segoe Print", "Comic Sans MS", cursive;
      font-size: clamp(16px, 9cqw, 36px);
      font-weight: 500;
      letter-spacing: -.025em;
      line-height: 1;
    }

    .mode-total {
      display: flex;
      min-height: clamp(32px, 15cqw, 52px);
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
      padding: 0 4cqw;
      background: #1d1b1c;
      color: #f5f2f4;
      font-family: "Blissful Thinking", "Segoe Print", "Comic Sans MS", cursive;
      font-size: clamp(14px, 6.5cqw, 27px);
      font-weight: 500;
      letter-spacing: -.025em;
    }

    .mode-total strong { font-weight: 500; }

    .mode-list {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 4px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 12px 8px 18px;
      scrollbar-color: #5c5962 transparent;
      scrollbar-width: thin;
    }

    .mode-section-label {
      flex: 0 0 auto;
      margin: 4px 0 0;
      color: #aaa7b0;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .16em;
    }

    .mode-entry {
      display: grid;
      min-height: clamp(48px, 24cqw, 88px);
      flex: 0 0 auto;
      grid-template-columns: minmax(0, 1fr) minmax(46px, 22cqw);
      align-items: center;
      gap: 6px;
      animation: mode-entry-in .42s both, mode-banner-float 3.2s ease-in-out infinite;
      animation-delay: min(calc(var(--entry-order) * 18ms), 450ms), calc(var(--entry-order) * -70ms);
    }

    .mode-banner {
      position: relative;
      display: flex;
      width: 100%;
      min-height: clamp(40px, 19cqw, 68px);
      align-items: center;
      gap: 8px;
      overflow: hidden;
      padding: 0 5cqw 0 4cqw;
      border: 0;
      clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%, 4% 50%);
      background: var(--banner-color);
      color: var(--banner-ink, #fff);
      cursor: pointer;
      text-align: left;
      text-shadow: var(--banner-shadow, 0 1px 2px rgba(0,0,0,.3));
    }

    .mode-banner::before {
      position: absolute;
      z-index: 1;
      inset: 3px 8% 3px 3%;
      border-top: 2px dotted rgba(255,255,255,.48);
      border-bottom: 2px dotted rgba(255,255,255,.48);
      content: "";
      pointer-events: none;
    }

    .mode-banner::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 32%, rgba(255,255,255,.15) 48%, transparent 64%);
      content: "";
      animation: mode-banner-shimmer 5.5s ease-in-out infinite;
      animation-delay: calc(var(--entry-order) * -180ms);
      pointer-events: none;
    }

    @keyframes mode-banner-shimmer {
      0%, 15% { transform: translateX(-120%); }
      75%, 100% { transform: translateX(120%); }
    }

    .mode-banner-classic .mode-symbol { display: none; }
    .mode-banner-classic .mode-name {
      max-width: calc(100% - 50px);
      margin: 0 34% 0 auto;
      font-size: clamp(17px, 8.6cqw, 30px);
      text-align: right;
    }

    .mode-banner-run {
      min-height: clamp(52px, 24cqw, 76px);
      padding: 0;
    }

    .mode-banner-run .mode-symbol { display: none; }
    .mode-banner-run .mode-name {
      display: flex;
      position: absolute;
      z-index: 2;
      top: 50%;
      right: 47%;
      gap: 0;
      width: max-content;
      max-width: none;
      overflow: visible;
      margin: 0;
      font-size: clamp(17px, 8.6cqw, 30px);
      transform: translateY(-50%);
    }

    .mode-letter {
      display: inline-block;
      animation: run-letter-jog 1.15s ease-in-out infinite;
      animation-delay: calc(var(--letter-index) * -180ms);
    }

    @keyframes run-letter-jog {
      0%, 18%, 58%, 100% { transform: translateY(0); }
      38% { transform: translateY(4px); }
    }

    .mode-run-ground {
      position: absolute;
      z-index: 1;
      right: 0;
      bottom: 2.5px;
      left: 0;
      height: 14px;
      border-bottom: 2px solid rgba(112,12,34,.78);
      background: #ff777f;
      pointer-events: none;
    }

    .mode-run-scallops {
      position: absolute;
      right: 0;
      bottom: calc(100% - 1px);
      left: 0;
      height: 7px;
      background: radial-gradient(ellipse 6px 6px at 6px 100%, #ff777f 96%, transparent 100%) 0 0 / 12px 7px repeat-x;
      transform: rotate(180deg);
      pointer-events: none;
    }

    .mode-run-ground::before,
    .mode-run-ground::after {
      position: absolute;
      right: 0;
      bottom: 100%;
      left: 0;
      height: 10px;
      background-repeat: repeat-x;
      content: "";
      pointer-events: none;
    }

    .mode-run-ground::before {
      opacity: .18;
      background-image:
        radial-gradient(ellipse 17px 13px at 17px 100%, #d93858 98%, transparent 100%),
        radial-gradient(ellipse 11px 9px at 11px 100%, #d93858 98%, transparent 100%);
      background-size: 52px 10px, 52px 8px;
      background-position: 0 0, 20px 2px;
      animation: run-hills-scroll 1.1s linear infinite;
    }

    .mode-run-ground::after {
      height: 7px;
      opacity: .25;
      background-image:
        radial-gradient(ellipse 13px 10px at 13px 100%, #f05b70 98%, transparent 100%),
        radial-gradient(ellipse 8px 7px at 8px 100%, #f05b70 98%, transparent 100%);
      background-size: 40px 7px, 40px 6px;
      background-position: 0 0, 17px 1px;
      animation: run-hills-scroll-back 0.72s linear infinite;
    }

    @keyframes run-hills-scroll {
      to { background-position: -52px 0, -32px 2px; }
    }

    @keyframes run-hills-scroll-back {
      to { background-position: -40px 0, -23px 2px; }
    }

    .mode-classic-loop {
      position: absolute;
      top: 50%;
      right: 10%;
      width: clamp(24px, 8.5cqw, 34px);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .mode-classic-loop::before {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: conic-gradient(#32E2F1 0 25%, #FFE80F 25% 50%, #FF0080 50% 75%, #8C12FB 75% 100%);
      -webkit-mask: radial-gradient(circle, transparent 0 49%, #000 56% 100%);
      mask: radial-gradient(circle, transparent 0 49%, #000 56% 100%);
      transform-origin: 50% 50%;
      animation: mode-classic-loop-spin 2.8s linear infinite;
      content: "";
    }

    @keyframes mode-classic-loop-spin {
      to { transform: rotate(360deg); }
    }

    .mode-banner:hover { filter: brightness(1.12); }
    .mode-banner:active { filter: brightness(.92); }

    .mode-symbol {
      z-index: 2;
      display: grid;
      width: clamp(22px, 9cqw, 32px);
      height: clamp(22px, 9cqw, 32px);
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      font-size: clamp(13px, 5cqw, 19px);
      font-weight: 900;
    }

    .mode-name {
      z-index: 2;
      max-width: 86%;
      margin: 0 8% 0 auto;
      overflow: hidden;
      font-family: "Blissful Thinking", "Segoe Print", "Comic Sans MS", cursive;
      font-size: clamp(17px, 8.6cqw, 30px);
      font-weight: 500;
      letter-spacing: .015em;
      text-align: right;
      text-transform: uppercase;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mode-progress {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #f3f1f5;
      font-family: "Blissful Thinking", "Segoe Print", "Comic Sans MS", cursive;
      line-height: 1;
    }

    .mode-progress strong {
      color: #f3e879;
      font-size: clamp(18px, 9.5cqw, 42px);
      font-weight: 700;
      letter-spacing: -.06em;
    }

    .mode-progress span {
      font-size: clamp(10px, 4.6cqw, 19px);
      font-weight: 500;
      letter-spacing: -.04em;
    }

    .mode-banner:focus-visible,
    .mode-home:focus-visible,
    .mode-back:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    @keyframes mode-entry-in {
      from { opacity: 0; transform: translateX(-14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes mode-banner-float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -2px; }
    }

    .wip-screen {
      display: flex;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .wip-mark {
      display: grid;
      width: 76px;
      height: 76px;
      margin-bottom: 20px;
      place-items: center;
      border: 2px solid #32E2F1;
      border-radius: 50%;
      color: #32E2F1;
      font-size: 35px;
      animation: wip-pulse 1.8s ease-in-out infinite;
    }

    @keyframes wip-pulse {
      50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(50,226,241,.3); }
    }

    .mode-back {
      min-height: 46px;
      margin-top: 18px;
      padding: 0 22px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 5px;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #32E2F1;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 14cqw, 66px);
      font-weight: 900;
      letter-spacing: -.025em;
      line-height: .95;
    }

    .title-accent {
      color: #FFE80F;
    }

    .subtitle {
      max-width: min(270px, 100%);
      margin: 4cqw auto 6cqw;
      color: #b4b1ba;
      font-size: clamp(11px, 3cqw, 14px);
      line-height: 1.65;
    }

    .button-stack {
      display: grid;
      gap: 11px;
    }

    .action-button {
      min-height: 54px;
      padding: 0 20px;
      border: 0;
      border-radius: 6px;
      background: #FFE80F;
      box-shadow: none;
      color: #272727;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .035em;
      transition: transform .15s ease, filter .15s ease;
    }

    .action-button:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .action-button:active { transform: translateY(1px) scale(.99); }

    .action-button.secondary {
      min-height: 49px;
      border: 1px solid rgba(255,255,255,.18);
      background: transparent;
      box-shadow: none;
      color: #f3f1f5;
    }

    .action-button:focus-visible,
    .jump-button:focus-visible,
    .mode-option:focus-visible,
    .mode-banner:focus-visible {
      outline: 2px solid #32E2F1;
      outline-offset: 3px;
    }

    .mode-option {
      padding: 17px 18px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 6px;
      background: #323137;
      color: #f3f1f5;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .mode-option:hover {
      transform: translateY(-2px);
      border-color: #8C12FB;
      background: #39373f;
    }

    .mode-option strong { display: block; font-size: 15px; }
    .mode-option span { display: block; margin-top: 5px; color: #aaa7b0; font-size: 12px; }

    .result-score {
      margin: 18px 0 23px;
      color: #aaa7b0;
      font-size: 13px;
    }

    .result-score strong { color: #FFE80F; font-size: 30px; }

    .controls {
      position: absolute;
      z-index: 1;
      inset: auto 0 max(26px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .controls.visible { opacity: 1; pointer-events: auto; }

    .jump-button {
      min-width: 126px;
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 6px;
      background: #8C12FB;
      box-shadow: none;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .14em;
      touch-action: manipulation;
      user-select: none;
    }

    .hint {
      color: #aaa7b0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-align: center;
    }

    @media (min-width: 600px) and (min-height: 700px) {
      .game-shell { border: 1px solid rgba(255,255,255,.08); border-radius: 30px; }
    }

    @media (max-height: 620px) {
      .game-shell { min-height: 0; }
      .panel:not(.mode-browser) { transform: scale(.88); }
      .panel.main-menu { transform: none; }
      .home-play-stack { width: min(58cqw, 210px); }
      .home-brand { top: 4%; }
      .home-mode-links { top: 88%; }
      .mode-list { gap: 5px; }
      .mode-entry { min-height: clamp(48px, 24cqw, 78px); }
      .mode-banner { min-height: clamp(40px, 19cqw, 60px); }
      .mode-banner-run { min-height: clamp(52px, 24cqw, 76px); }
      .subtitle { margin-top: 12px; margin-bottom: 18px; }
      .action-button { min-height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Color Switch: Revamped arcade game">
    <canvas id="game-canvas" aria-label="Game field"></canvas>
    <section class="hud" id="hud" aria-live="polite">
      <div>
        <div class="score-label">Stars collected</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="mode-chip" id="mode-chip">Endless</div>
    </section>
    <section class="overlay" id="overlay">
      <div class="panel" id="panel"></div>
    </section>
    <div class="controls" id="controls" aria-label="Jump controls">
      <button class="jump-button" id="jump-button" aria-label="Jump">TAP TO BOUNCE</button>
      <span class="hint">Tap, click, or press SPACE</span>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
